# Canton overrides for the long-running shared demo. Passed to `daml sandbox -c`.
#
# WHY THIS EXISTS: the JSON Ledger API caps a POST /v2/state/active-contracts response
# at 200 elements by default and returns HTTP 413
# (JSON_API_MAXIMUM_LIST_ELEMENTS_NUMBER_REACHED) rather than truncating. The scheduler
# reads the ACS on every tick, so once the ledger crosses that line EVERY read fails and
# the engine wedges: it keeps ticking, dispatches nothing, and the vault sits frozen with
# a healthy-looking container in front of it. Observed on the box 2026-08-03, roughly ten
# minutes after boot, at 201 contracts.
#
# A demo that is wiped every six hours accumulates well past 200 in normal operation. The
# audit trail alone (one EpochReport plus the epoch's PremiumReceipts) is a handful of
# contracts per epoch and is the thing the settlement history page exists to show, so
# archiving it to stay under the cap would delete the demo's point. Raising the cap is
# the correct lever.
#
# 20000 is chosen to be far above six hours of accumulation at any clock this demo runs,
# while still bounding a runaway query. It is a demo-ledger setting: a production
# participant should page or stream these endpoints instead (the same endpoints offer a
# websocket flavor for exactly that reason).
canton.participants.sandbox.http-ledger-api.websocket-config.http-list-max-elements-limit = 20000
