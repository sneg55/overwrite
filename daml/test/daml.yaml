# Test-only package: Daml Script proofs for the settlement spikes. Kept separate
# from the templates package so the deployable DAR never bundles daml-script.
# Built via the sibling multi-package.yaml, which builds `overwrite` first.
sdk-version: "3.4.11"
name: overwrite-test
version: 0.1.0
source: .
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../.daml/dist/overwrite-vault-1.2.0.dar
  # Token-standard interfaces, so the settlement proofs can import them directly
  # (the overwrite DAR bundles them but leaves them hidden to downstream packages).
  - ../vendor/splice-api-token-metadata-v1.dar
  - ../vendor/splice-api-token-holding-v1.dar
  - ../vendor/splice-api-token-allocation-v1.dar
  - ../vendor/splice-api-token-allocation-instruction-v1.dar
